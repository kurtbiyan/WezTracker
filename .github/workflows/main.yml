name: WezTracker APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WezTracker APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract the WezTracker ZIP
      - name: Extract WezTracker ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p build-source

          unzip -q "$ZIP_FILE" -d build-source

          echo "Extracted project:"
          find build-source -maxdepth 3 -type f | head -100

      # 3. Locate the Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find build-source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      # 4. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Build APK
      - name: Build WezTracker APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      # 7. Find APK
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/WezTracker-v1.0.0.apk"

      # 8. Upload APK to GitHub Actions
      - name: Upload WezTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: WezTracker-v1.0.0
          path: release/WezTracker-v1.0.0.apk
          if-no-files-found: error
